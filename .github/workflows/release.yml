name: Release & Package Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.4)'
        required: false
        default: ''

# Default to read-only; jobs that need more request it explicitly below.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate: never build or publish a release whose test suite is red.
  test:
    name: Test Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Test Suite
        run: cargo test --workspace --locked

  build-tarballs:
    name: Build - ${{ matrix.platform_name }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by actions/attest-build-provenance.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: x86_64-unknown-linux-gnu
            platform_name: linux-gnu-x86_64
            use_cross: false
          - rust_target: x86_64-unknown-linux-musl
            platform_name: linux-musl-x86_64
            use_cross: false
          - rust_target: aarch64-unknown-linux-gnu
            platform_name: linux-gnu-aarch64
            use_cross: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools zstd rpm dpkg-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Cross
        if: matrix.use_cross
        # Pinned: a floating cross release must not silently change the build.
        run: cargo install cross --version 0.2.5

      - name: Resolve Version
        id: meta
        env:
          # Untrusted event value routed through env (never interpolated into run).
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          CARGO_VER="$(grep -E '^version[[:space:]]*=' Cargo.toml | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')"
          if [[ "$RAW_TAG" == v* ]]; then
            VER="${RAW_TAG#v}"
            if [[ "$VER" != "$CARGO_VER" ]]; then
              echo "::error::Tag version (${VER}) does not match Cargo.toml workspace version (${CARGO_VER})"
              exit 1
            fi
          else
            VER="$CARGO_VER"
          fi
          {
            echo "version=${VER}"
            echo "tag=v${VER}"
          } >> "$GITHUB_OUTPUT"

      - name: Build Release Binaries
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --locked --target "${{ matrix.rust_target }}" -p rustfetch
          else
            cargo build --release --locked --target "${{ matrix.rust_target }}" -p rustfetch
          fi

      - name: Package Clean Archive & Native Distro Packages
        env:
          VER: ${{ steps.meta.outputs.version }}
          PLATFORM: ${{ matrix.platform_name }}
          TARGET_TRIPLE: ${{ matrix.rust_target }}
        run: |
          TARGET_DIR="target/${TARGET_TRIPLE}/release"

          mkdir -p dist
          STAGE="stage/rustfetch-v${VER}-${PLATFORM}"
          mkdir -p "$STAGE/completions" "$STAGE/man"

          cp "$TARGET_DIR/rustfetch" "$STAGE/rustfetch"
          cp "$TARGET_DIR/rfetch" "$STAGE/rfetch"
          chmod 755 "$STAGE/rustfetch" "$STAGE/rfetch"
          cp README.md LICENSE "$STAGE/"
          cp docs/rustfetch.1 "$STAGE/man/rustfetch.1"

          if "$STAGE/rustfetch" --completions bash > "$STAGE/completions/rustfetch.bash" 2>/dev/null; then
            "$STAGE/rustfetch" --completions zsh > "$STAGE/completions/_rustfetch"
            "$STAGE/rustfetch" --completions fish > "$STAGE/completions/rustfetch.fish"
          else
            # Cross-compiled targets (aarch64) cannot run on the x86_64 runner.
            cargo run -q --locked --bin rustfetch -- --completions bash > "$STAGE/completions/rustfetch.bash"
            cargo run -q --locked --bin rustfetch -- --completions zsh > "$STAGE/completions/_rustfetch"
            cargo run -q --locked --bin rustfetch -- --completions fish > "$STAGE/completions/rustfetch.fish"
          fi
          test -s "$STAGE/completions/rustfetch.bash"
          test -s "$STAGE/completions/_rustfetch"
          test -s "$STAGE/completions/rustfetch.fish"

          # Deterministic tarballs: stable file order, timestamps and ownership.
          TAR_FLAGS=(--sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner)

          # 1. Clean platform tarball (no 'unknown' in filename)
          ARCHIVE="rustfetch-v${VER}-${PLATFORM}.tar.gz"
          tar -C stage "${TAR_FLAGS[@]}" -czf "dist/${ARCHIVE}" "rustfetch-v${VER}-${PLATFORM}"
          cp "dist/${ARCHIVE}" "dist/rustfetch-${PLATFORM}.tar.gz"

          # 2. Build NixOS bundle from static musl x86_64 target
          if [ "$PLATFORM" = "linux-musl-x86_64" ]; then
            NIX_STAGE="stage/rustfetch-v${VER}-nixos-x86_64"
            cp -r "$STAGE" "$NIX_STAGE"
            if [ -f flake.nix ]; then
              cp flake.nix "$NIX_STAGE/"
            fi
            tar -C stage "${TAR_FLAGS[@]}" -czf "dist/rustfetch-v${VER}-nixos-x86_64.tar.gz" "rustfetch-v${VER}-nixos-x86_64"
          fi

          # 3. Build native Arch (.pkg.tar.zst), Fedora (.rpm), and Debian (.deb) packages on x86_64 gnu
          if [ "$PLATFORM" = "linux-gnu-x86_64" ]; then
            bash scripts/build-packages.sh "$VER" "$STAGE" dist
          fi

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform_name }}
          path: dist/*

  publish-release:
    name: Publish GitHub Release & Changelog
    needs: build-tarballs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-Input
          merge-multiple: true

      - name: Generate Release Notes (with Cat Breed Codename) & Checksums
        id: notes
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          CARGO_VER="$(grep -E '^version[[:space:]]*=' Cargo.toml | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')"
          if [[ "$RAW_TAG" == v* ]]; then
            VER="${RAW_TAG#v}"
            TAG="$RAW_TAG"
          else
            VER="$CARGO_VER"
            TAG="v${VER}"
          fi
          if [[ "$TAG" != "v${CARGO_VER}" ]]; then
            echo "::error::Tag ${TAG} does not match Cargo.toml workspace version v${CARGO_VER}"
            exit 1
          fi

          CODENAME="$(bash scripts/release-notes.sh --codename "$VER")"
          TITLE="$(bash scripts/release-notes.sh --title "$VER")"
          bash scripts/release-notes.sh "$VER" > RELEASE_NOTES.md

          (
            cd release-Input
            sha256sum -- * > SHA256SUMS.txt
          )

          {
            echo "tag=${TAG}"
            echo "version=${VER}"
            echo "codename=${CODENAME}"
            echo "title=${TITLE}"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.title }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            release-Input/*
