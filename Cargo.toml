[workspace]
members = ["core", "render", "cli"]
resolver = "3"

[workspace.package]
version = "0.1.5"
authors = ["MehmetCanWT"]
edition = "2024"
# Minimum supported Rust version, enforced by the dedicated MSRV CI job and
# declared by every member crate through `rust-version.workspace = true`.
#
# 1.88 is derived from Rust Edition 2024 (1.85+) and the locked dependency graph
# (`image 0.25.10` and transitive crates require 1.88.0). Bump this together
# with Cargo.lock; verify with the CI `msrv` job.
rust-version = "1.88"
description = "Fast, modular system information tool written in Rust."
repository = "https://github.com/MehmetCanWT/rustfetch"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
